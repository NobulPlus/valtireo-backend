<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123F3A" />
    <meta name="description" content="Valtireo — the organizational OS for people, requests, and decisions." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Valtireo" />
    <title>Valtireo</title>
    <script>
      // Applies a saved theme choice before first paint, so there's no flash
      // of the wrong theme. Absent or 'system' leaves no attribute — the
      // prefers-color-scheme media query in index.css handles that case.
      // Must mirror context/ThemeContext.tsx's storage key and value set.
      (function () {
        try {
          var stored = localStorage.getItem('valtireo-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
