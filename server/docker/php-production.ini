expose_php=Off
display_errors=Off
log_errors=On
memory_limit=256M
max_execution_time=120
max_input_time=120
post_max_size=25M
upload_max_filesize=25M

opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
